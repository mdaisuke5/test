name: CI

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: abatilo/actions-poetry@v2
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: |
          poetry run black --check .
          poetry run ruff .
      - name: Test
        run: poetry run pytest
