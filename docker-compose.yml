version: "3.9"
services:
  strategy:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    ports:
      - "${STRATEGY_PORT:-8000}:8000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  loki:
    image: grafana/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
