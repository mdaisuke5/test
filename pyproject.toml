[tool.poetry]
name = "nikkei-trader"
version = "0.1.0"
description = "Automated trading system for Nikkei-225 futures using Backtrader and kabu.com API"
authors = ["Trading Engineer <dev@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
backtrader = "^1.9.78.123"
pandas = "^2.2.2"
numpy = "^1.26.4"
pyyaml = "^6.0.1"
redis = "^5.0.4"
requests = "^2.32.3"
structlog = "^24.1.0"
ratelimit = "^2.2.1"
scipy = "^1.13.1"
matplotlib = "^3.8.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
